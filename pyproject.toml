[project]
name = "mid-term-project"
version = "0.1.0"
description = "Accident fatality prediction service"
readme = "README.md"
authors = [
    { name = "Abdulrahman Gidado", email = "gidadoabdulrahman85@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
mid-term-project = "mid_term_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
